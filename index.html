<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTIC</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    height: 56px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }

  .nav-logo {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 400;
    text-decoration: none;
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 6px;
  }

  .hamburger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: #fff;
    transition: transform 0.3s, opacity 0.3s;
  }

  /* ── MENU OVERLAY ── */
  .menu-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .menu-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .menu-overlay a {
    color: #fff;
    text-decoration: none;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.85;
    transition: opacity 0.2s;
  }

  .menu-overlay a:hover { opacity: 1; }

  .menu-socials {
    display: flex;
    gap: 28px;
    margin-top: 16px;
  }

  .menu-socials a {
    font-size: unset;
    letter-spacing: unset;
    text-transform: unset;
    font-weight: unset;
    opacity: 0.45;
    color: #fff;
    display: flex;
    align-items: center;
    transition: opacity 0.2s;
  }

  .menu-socials a:hover { opacity: 1; }

  .menu-socials svg {
    width: 20px;
    height: 20px;
  }

  /* ── GRID ── */
  main {
    padding-top: 56px; /* nav height */
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }

  .grid-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #0a0a0a;
  }

  .grid-item.wide {
    grid-column: span 2;
  }

  .grid-item img,
  .grid-item video {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.45s ease, filter 0.45s ease;
    filter: brightness(0.92);
  }

  .grid-item:hover img,
  .grid-item:hover video {
    transform: scale(1.03);
    filter: brightness(1.05);
  }

  /* Video play icon */
  .play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .play-icon svg {
    width: 40px;
    height: 40px;
    opacity: 0.75;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open { display: flex; }

  .lightbox-media {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    pointer-events: none;
  }

  .lb-close {
    position: fixed;
    top: 18px; right: 22px;
    color: #fff;
    font-size: 30px;
    font-weight: 200;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
    line-height: 1;
    user-select: none;
    z-index: 101;
  }

  .lb-close:hover { opacity: 1; }

  .lb-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    opacity: 0.25;
    padding: 20px 16px;
    transition: opacity 0.2s;
    user-select: none;
    z-index: 101;
  }

  .lb-arrow:hover { opacity: 1; }
  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  /* ── EMPTY STATE ── */
  .empty-state {
    position: fixed;
    inset: 56px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .grid-item.wide { grid-column: span 1; }
  }
</style>
</head>
<body>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lbBgClose(event)">
  <span class="lb-close" onclick="closeLb()">×</span>
  <span class="lb-arrow lb-prev" onclick="lbNav(-1, event)">←</span>
  <img class="lightbox-media" id="lbImg" src="" alt="" style="display:none">
  <video class="lightbox-media" id="lbVideo" controls style="display:none"></video>
  <span class="lb-arrow lb-next" onclick="lbNav(1, event)">→</span>
</div>

<script>
  // ── MENU ──
  let menuOpen = false;
  function toggleMenu() {
    menuOpen = !menuOpen;
    document.getElementById('menuOverlay').classList.toggle('open', menuOpen);
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }

  // ── GRID AUTO-WIRE ──
  function wireGrid() {
    const items = [...document.querySelectorAll('.grid-item')];
    const empty = document.getElementById('emptyState');
    empty.style.display = items.length ? 'none' : 'flex';
    items.forEach((item, i) => {
      item.addEventListener('click', () => openLb(i));
    });
  }

  // ── LIGHTBOX ──
  let lbIndex = 0;

  function getItems() { return [...document.querySelectorAll('.grid-item')]; }

  function openLb(index) {
    const items = getItems();
    lbIndex = index;
    showLbItem(items[lbIndex]);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLbItem(item) {
    const img = document.getElementById('lbImg');
    const vid = document.getElementById('lbVideo');
    const isVideo = item.dataset.type === 'video';
    const srcEl = item.querySelector('img, video');

    img.style.display = isVideo ? 'none' : 'block';
    vid.style.display = isVideo ? 'block' : 'none';

    if (isVideo) {
      vid.src = srcEl.src;
      vid.load();
    } else {
      img.src = srcEl.src;
    }
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lbVideo').pause();
    document.body.style.overflow = '';
  }

  function lbBgClose(e) {
    if (e.target === document.getElementById('lightbox')) closeLb();
  }

  function lbNav(dir, e) {
    if (e) e.stopPropagation();
    const items = getItems();
    lbIndex = (lbIndex + dir + items.length) % items.length;
    showLbItem(items[lbIndex]);
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });

  wireGrid();
</script>
