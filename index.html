<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octic — Seth Pena | Automotive Photographer & Videographer | Austin, TX</title>
<meta name="description" content="Octic is the automotive photography and videography brand of Seth Pena, based in Austin, Texas. Specializing in supercars, hypercars, and cinematic VHS-aesthetic content.">
<meta property="og:title" content="Octic — Seth Pena | Automotive Photographer">
<meta property="og:description" content="Cinematic automotive photography and videography based in Austin, TX.">
<meta property="og:url" content="https://octicseth.com">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    height: 56px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    transition: transform 0.3s ease;
  }

  .nav-logo {
    text-decoration: none;
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 6px;
  }

  .hamburger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: #fff;
    transition: transform 0.3s, opacity 0.3s;
  }

  /* ── MENU OVERLAY ── */
  .menu-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .menu-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .menu-overlay > a {
    color: #fff;
    text-decoration: none;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.85;
    transition: opacity 0.2s;
  }

  .menu-overlay > a:hover { opacity: 1; }

  .menu-socials {
    display: flex;
    gap: 28px;
    margin-top: 16px;
  }

  .menu-socials a {
    opacity: 0.45;
    color: #fff;
    display: flex;
    align-items: center;
    transition: opacity 0.2s;
  }

  .menu-socials a:hover { opacity: 1; }

  .menu-socials svg {
    width: 20px;
    height: 20px;
  }

  /* ── MASONRY ── */
  main {
    padding-top: 56px;
  }

  .masonry {
    columns: 2;
    column-gap: 0;
  }

  .masonry-item {
    break-inside: avoid;
    cursor: pointer;
    display: block;
    position: relative;
  }

  .masonry-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: filter 0.4s ease;
    filter: brightness(0.92);
  }

  .masonry-item:hover img {
    filter: brightness(1.05);
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open { display: flex; }

  .lightbox-media {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    pointer-events: none;
  }

  .lb-close {
    position: fixed;
    top: 18px; right: 22px;
    color: #fff;
    font-size: 30px;
    font-weight: 200;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
    line-height: 1;
    user-select: none;
    z-index: 101;
  }

  .lb-close:hover { opacity: 1; }

  .lb-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    opacity: 0.25;
    padding: 20px 16px;
    transition: opacity 0.2s;
    user-select: none;
    z-index: 101;
  }

  .lb-arrow:hover { opacity: 1; }
  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  /* ── CONTACT POPUP ── */
  .contact-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
  }

  .contact-backdrop.open {
    display: flex;
  }

  .contact-popup {
    background: #000;
    border: 1px solid #222;
    width: min(520px, 92vw);
    padding: 48px 40px;
    position: relative;
  }

  .contact-popup h2 {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 40px;
  }

  .contact-body {
    display: flex;
    gap: 40px;
  }

  .contact-form {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .contact-form label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
  }

  .contact-form input,
  .contact-form textarea {
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    padding: 6px 0;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    border-bottom-color: #fff;
  }

  .contact-form textarea {
    height: 40px;
  }

  .contact-submit {
    margin-top: 8px;
    background: #fff;
    color: #000;
    border: none;
    padding: 14px 0;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: opacity 0.2s;
  }

  .contact-submit:hover { opacity: 0.8; }

  .contact-info {
    width: 160px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .contact-info-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .contact-info-block span {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
  }

  .contact-info-block a,
  .contact-info-block p {
    color: #fff;
    font-size: 13px;
    text-decoration: none;
    font-weight: 300;
  }

  .contact-info-block a:hover { opacity: 0.7; }

  .contact-info-socials {
    display: flex;
    gap: 18px;
    margin-top: auto;
    padding-top: 32px;
  }

  .contact-info-socials a {
    color: #fff;
    opacity: 0.4;
    transition: opacity 0.2s;
    display: flex;
  }

  .contact-info-socials a:hover { opacity: 1; }
  .contact-info-socials svg { width: 18px; height: 18px; }

  .contact-close {
    position: absolute;
    top: 16px; right: 20px;
    color: #555;
    font-size: 24px;
    font-weight: 200;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
    user-select: none;
  }

  .contact-close:hover { color: #fff; }

  @media (max-width: 540px) {
    .contact-body { flex-direction: column; }
    .contact-info { width: 100%; }
    .contact-popup { padding: 36px 24px; }
  }

  @media (max-width: 480px) {
    .masonry { columns: 1; }
  }
</style>
</head>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lbBgClose(event)">
  <span class="lb-close" onclick="closeLb()">×</span>
  <span class="lb-arrow lb-prev" onclick="lbNav(-1, event)">←</span>
  <img class="lightbox-media" id="lbImg" src="" alt="">
  <span class="lb-arrow lb-next" onclick="lbNav(1, event)">→</span>
</div>

<script>
  // ── NAV HIDE/SHOW ON SCROLL ──
  let lastScroll = 0;
  window.addEventListener('scroll', () => {
    const current = window.scrollY;
    const nav = document.querySelector('nav');
    if (current <= 10) {
      nav.style.transform = 'translateY(0)';
    } else if (current > lastScroll) {
      nav.style.transform = 'translateY(-100%)';
    } else {
      nav.style.transform = 'translateY(0)';
    }
    lastScroll = current;
  });

  // ── MENU ──
  let menuOpen = false;
  function toggleMenu() {
    menuOpen = !menuOpen;
    document.getElementById('menuOverlay').classList.toggle('open', menuOpen);
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }

  // ── LIGHTBOX ──
  let lbIndex = 0;
  function getItems() { return [...document.querySelectorAll('.masonry-item')]; }

  function openLb(index) {
    lbIndex = index;
    const items = getItems();
    document.getElementById('lbImg').src = items[lbIndex].querySelector('img').src;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lbBgClose(e) {
    if (e.target === document.getElementById('lightbox')) closeLb();
  }

  function lbNav(dir, e) {
    if (e) e.stopPropagation();
    const items = getItems();
    lbIndex = (lbIndex + dir + items.length) % items.length;
    document.getElementById('lbImg').src = items[lbIndex].querySelector('img').src;
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });

  // ── CONTACT POPUP ──
  function openContact() {
    toggleMenu();
    document.getElementById('contactBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeContact() {
    document.getElementById('contactBackdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  function backdropClose(e) {
    if (e.target === document.getElementById('contactBackdrop')) closeContact();
  }

  async function submitContact() {
    const btn = document.querySelector('.contact-submit');
    const name = document.querySelector('.contact-form input[type="text"]').value;
    const email = document.querySelector('.contact-form input[type="email"]').value;
    const message = document.querySelector('.contact-form textarea').value;

    if (!name || !email || !message) {
      btn.textContent = 'Fill all fields';
      setTimeout(() => btn.textContent = 'Send', 2000);
      return;
    }

    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      const res = await fetch('https://formspree.io/f/mkoawjvp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name, email, message })
      });

      if (res.ok) {
        btn.textContent = 'Sent ✓';
        document.querySelector('.contact-form input[type="text"]').value = '';
        document.querySelector('.contact-form input[type="email"]').value = '';
        document.querySelector('.contact-form textarea').value = '';
        setTimeout(() => { btn.textContent = 'Send'; btn.disabled = false; }, 3000);
      } else {
        btn.textContent = 'Error — try again';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = 'Error — try again';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeContact();
  });

  // Wire clicks
  getItems().forEach((item, i) => item.addEventListener('click', () => openLb(i)));
</script>
